# =============================================================================
# Trunk.io — Plugin versions for linting/formatting tools
# =============================================================================
# This file is auto-generated. Run `trunk upgrade` to update.
# https://docs.trunk.io/check/reference
# =============================================================================

plugins:
  sources:
    - id: trunk
      ref: v1.2.2
    - id: community
      ref: main

# Linters (C#-relevant only)
linters:
  actionlint:
    enabled: true
    commands:
      - name: actionlint
        run: actionlint ${target}
        direct_configs:
          - .github/workflows/*.yml
  yamllint:
    enabled: true
  taplo:
    enabled: true
  shellcheck:
    enabled: true

# Formatters
formatters:
  prettier:
    enabled: true
    direct_configs:
      - .prettierrc
      - prettier.config.*

# Actions (CI optimization)
actions:
  trunk-check:
    enabled: true
    size: 5GB
    memory: 16GB
    disk: 10GB
  trunk-merge:
    enabled: true
    size: 5GB
  trunk-push:
    enabled: true
    size: 5GB

# Caching
cache:
  enabled: true
  storage: local

# CLI
cli:
  version: 1.22.2

# Environment
env:
  variables:
    EDITOR: vim
